name: Build, verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # No schedule: the citation and metadata workflows push with GITHUB_TOKEN,
  # which triggers no other workflow, so they dispatch this one themselves.
  # Refreshed numbers therefore reach the live site within minutes of changing,
  # instead of waiting for a nightly rebuild.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Formatting and type-checking used to be a separate `lint` workflow, which
      # meant a second checkout and `npm ci` on every pull request for two
      # commands that need the same install this job already does.
      - name: Format check
        run: npx prettier . --check

      # Both sync the content layer, which fetches the project READMEs and asks
      # the GitHub API which repositories are archived. The token lifts the
      # 60-requests-an-hour anonymous limit.
      - name: Type-check
        run: npx astro check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Guards the two things that must never silently change — the Matrix
      # client discovery files and the publication PDF bytes.
      - name: Verify invariants
        run: npm run verify

      - name: Deploy to gh-pages
        # The ref guard matters for workflow_dispatch, which can be fired on any branch.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          # The server only pulls the latest build, so the branch keeps no history.
          single-commit: true
          git-config-name: ci@fuchss.org
          git-config-email: ci@fuchss.org
