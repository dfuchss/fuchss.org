name: Update GitHub repository metadata

on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    paths: [src/data/repositories.yml]
    branches: [main]
  workflow_dispatch:

# actions: write lets the job start deploy.yml itself.
permissions:
  contents: write
  actions: write

# Queued, never cancelled: a cancelled run could leave a commit that never deploys.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Replaces the old _plugins/github-metadata.rb, which hit the GitHub API on
      # every Jekyll build. Committing the result keeps the site build hermetic:
      # an API outage can no longer break a deploy or render zeros.
      - name: Fetch metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-github-metadata.mjs

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- src/data/github-metadata.json; then
            echo "No metadata changes."
            exit 0
          fi
          git config user.name "ci@fuchss.org"
          git config user.email "ci@fuchss.org"
          git add src/data/github-metadata.json
          git commit -m "Update GitHub repository metadata"
          # The other data workflow may have pushed since checkout.
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN triggers no other workflow, but a dispatch
      # does. No fallback: a green job whose data never ships is the failure to avoid.
      - name: Rebuild the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
