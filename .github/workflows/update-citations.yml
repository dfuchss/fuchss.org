name: Update Google Scholar citations

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# actions: write lets the job start deploy.yml itself.
permissions:
  contents: write
  actions: write

# Queued, never cancelled: a cancelled run could leave a commit that never deploys.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fetch citations
        shell: bash
        # The script keeps its own 270s budget and exits 0 when Scholar rate-limits
        # it; `timeout` is only the backstop. 124 (clean SIGTERM), 143 (the shell
        # reporting that SIGTERM) and 137 (SIGKILL from --kill-after) all just mean
        # Scholar did not answer: citations.yml is untouched and the next run retries.
        run: |
          set +e
          timeout --signal=TERM --kill-after=30 300 node scripts/update-scholar-citations.mjs
          rc=$?
          set -e
          case $rc in
            0)             echo "✅ Citation fetch completed." >> "$GITHUB_STEP_SUMMARY" ;;
            124|137|143)   echo "⏱️ Google Scholar did not answer in time (exit $rc); citations left unchanged." >> "$GITHUB_STEP_SUMMARY"; rc=0 ;;
            *)             echo "❌ Citation script failed with exit code $rc." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          exit $rc

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- src/data/citations.yml; then
            echo "No citation changes."
            exit 0
          fi
          git config user.name "ci@fuchss.org"
          git config user.email "ci@fuchss.org"
          git add src/data/citations.yml
          git commit -m "Update Google Scholar citations"
          # The other data workflow may have pushed since checkout.
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN triggers no other workflow, but a dispatch
      # does. No fallback: a green job whose data never ships is the failure to avoid.
      - name: Rebuild the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
